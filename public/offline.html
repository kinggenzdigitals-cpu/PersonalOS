<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Finance & Habit Tracker</title>
    <!--
      A precached static file: the service worker serves it for any failed
      navigation, so it never loads globals.css and cannot inherit the app's
      tokens. The values below are hard copies of the dark palette
      (--background #0b1220, --foreground #e8edf5, --muted-foreground #9aa6bd,
      --brand #5a9dff, --sage #a6d95f) and must be updated by hand if those
      change. They were the retired cream/terracotta palette until now, which
      meant losing connection mid-session threw a dark-adapted user onto a
      full-screen light page in colours the app no longer even uses.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #e8edf5;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 340px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #5a9dff;
        display: grid;
        place-items: center;
      }
      .mark span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 6px solid #0b1220;
        box-sizing: border-box;
        position: relative;
      }
      .mark span::after {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: #a6d95f;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #9aa6bd;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #5a9dff;
        /* Dark ink on the lifted blue: white would land at ~2.5:1. */
        color: #04122e;
        border: 0;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span></span></div>
      <h1>You're offline</h1>
      <p>
        Finance & Habit Tracker needs a connection to load your data. Check your network and try
        again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
