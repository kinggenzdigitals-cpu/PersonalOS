<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Life OS</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf6f1;
        color: #2d2a26;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 340px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #c4643b;
        display: grid;
        place-items: center;
      }
      .mark span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 6px solid #faf6f1;
        box-sizing: border-box;
        position: relative;
      }
      .mark span::after {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: #7c9082;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #6b6459;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #c4643b;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span></span></div>
      <h1>You're offline</h1>
      <p>
        Life OS needs a connection to load your data. Check your network and try
        again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
